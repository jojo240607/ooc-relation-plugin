<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: var(--vscode-font-family);
            padding: 10px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            background: var(--vscode-editor-background);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }
        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message-row.assistant,
        .message-row.system,
        .message-row.step {
            align-self: flex-start;
        }
        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .bubble {
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            position: relative;
        }
        .user .bubble {
            background: #2b6cb0;
            color: white;
        }
        .assistant .bubble {
            background: var(--vscode-input-background);
        }
        .system .bubble {
            background: #6b7280;
            color: white;
        }
        .step .bubble {
            background: #4b5563;
            color: white;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .input-area {
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }
        #resize-handle {
            height: 4px;
            background: var(--vscode-input-border);
            cursor: ns-resize;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        #input-row {
            display: flex;
        }
        #userInput {
            flex: 1;
            margin-right: 5px;
            min-height: 30px;
            max-height: 200px;
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            padding: 6px;
            font-family: var(--vscode-font-family);
            resize: none;
        }
        button {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
        }
        .thinking-box {
            margin: 4px 0 4px 36px;
            max-width: 85%;
            border: 1px solid var(--vscode-input-border);
            border-radius: 6px;
            background: var(--vscode-editor-background);
            display: block;
            overflow: visible !important;
            height: auto !important;
            min-height: unset;
            flex-shrink: 0;
        }
        .thinking-header {
            background: var(--vscode-editor-background);
            padding: 4px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--vscode-foreground);
            user-select: none;
        }
        .thinking-header:hover {
            background: var(--vscode-list-hoverBackground);
        }
        .thinking-content {
            padding: 4px 8px;
            font-family: var(--vscode-editor-font-family);
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            white-space: pre-wrap;
            display: none;
            overflow: visible;
        }
        .thinking-box.expanded .thinking-content {
            display: block;
            height: auto;
        }
        .thinking-icon {
            transition: none;
            display: inline-block;
        }
        .thinking-box.expanded .thinking-icon {
            transform: none;
        }
    </style>
</head>
<body>
    <div id="messages"></div>
    <div class="input-area">
        <div id="resize-handle"></div>
        <div id="input-row">
            <textarea id="userInput" rows="2" placeholder="描述你想创建的 OOC 类..."></textarea>
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        const initialHistory = {{HISTORY_JSON}};
        const inputHistory = {{INPUT_HISTORY_JSON}};
        let historyIndex = inputHistory.length;

        const stepDomMap = new Map();
        let currentStreamingThinkPanel = null;
        let currentStreamingBubble = null;

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function createThinkingPanel() {
            const panel = document.createElement('div');
            panel.className = 'thinking-box expanded';
            const header = document.createElement('div');
            header.className = 'thinking-header';
            header.innerHTML = '<span class="thinking-icon">▼</span> 推理过程';
            header.addEventListener('click', () => {
                panel.classList.toggle('expanded');
                const icon = panel.querySelector('.thinking-icon');
                icon.textContent = panel.classList.contains('expanded') ? '▼' : '▶';
            });
            const content = document.createElement('div');
            content.className = 'thinking-content';
            panel.appendChild(header);
            panel.appendChild(content);
            return panel;
        }

        function appendThinkingContent(panel, text) {
            const content = panel.querySelector('.thinking-content');
            content.textContent += text;
            content.scrollTop = content.scrollHeight;
        }

        // 添加可折叠的代码块
        function setupCollapsibleCode(bubble, text) {
            const MAX = 500;
            const codeKeys = ['#include', 'struct ', 'static ', 'void ', 'int ', '{', '}'];
            const isCode = text.length > MAX && codeKeys.some(k => text.includes(k));
            if (!isCode) {
                bubble.textContent = text;
                return;
            }

            // 折叠状态
            let collapsed = true;
            const collapsedText = `[代码过长已折叠，共 ${text.split(/\r?\n/).length} 行]`;
            const fullText = text;

            function render() {
                bubble.innerHTML = ''; // 清空
                if (collapsed) {
                    const span = document.createElement('span');
                    span.textContent = collapsedText;
                    bubble.appendChild(span);

                    const btn = document.createElement('button');
                    btn.textContent = '展开';
                    btn.onclick = () => {
                        collapsed = false;
                        render();
                    };
                    bubble.appendChild(btn);
                } else {
                    // 展开状态：显示完整文本 + 收起按钮
                    const content = document.createElement('span');
                    content.textContent = fullText;
                    bubble.appendChild(content);

                    const btn = document.createElement('button');
                    btn.textContent = '收起';
                    btn.onclick = () => {
                        collapsed = true;
                        render();
                    };
                    bubble.appendChild(btn);
                }
            }

            render();
        }

        function addMessageBubble(role, text) {
            const row = document.createElement('div');
            row.className = 'message-row ' + role;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const avatars = { user: '🧑', assistant: '🤖', system: '⚠️', step: '⚙️' };
            avatar.textContent = avatars[role] || '🤖';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            setupCollapsibleCode(bubble, text);

            row.appendChild(avatar);
            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return row;
        }

        initialHistory.forEach(msg => {
            if (msg.role === 'tool') return;
            addMessageBubble(msg.role, msg.text);
        });

        window.addEventListener('message', event => {
            const msg = event.data;
            console.log('[DEBUG] message received:', JSON.stringify(msg, null, 2));
            switch (msg.command) {
                case 'addMessage':
                    addMessageBubble(msg.role, msg.text);
                    setLoading(false);
                    break;

                case 'stepStart': {
                    const stepId = msg.stepId;
                    const row = document.createElement('div');
                    row.className = 'message-row step';
                    row.id = stepId;
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.textContent = '⚙️';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.innerHTML = '<span class="spinner"></span> ' + msg.text;
                    row.appendChild(avatar);
                    row.appendChild(bubble);
                    messagesDiv.appendChild(row);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;

                    let thinkPanel = null;
                    if (msg.reasoning) {
                        thinkPanel = createThinkingPanel();
                        appendThinkingContent(thinkPanel, msg.reasoning);
                        row.after(thinkPanel);
                    }

                    stepDomMap.set(stepId, { row, thinkPanel });
                    window._currentStepId = stepId;
                    break;
                }

                case 'stepResult': {
                    const stepId = window._currentStepId;
                    if (!stepId) break;
                    const data = stepDomMap.get(stepId);
                    if (!data) break;
                    const { row, thinkPanel } = data;
                    const bubble = row.querySelector('.bubble');
                    if (!bubble) break;

                    const text = msg.text || '';
                    const isMcp = text.includes('[MCP]');
                    const avatar = row.querySelector('.avatar');
                    avatar.textContent = isMcp ? '🔍' : '🤖';

                    // 使用可折叠代码块
                    setupCollapsibleCode(bubble, text);

                    if (thinkPanel) {
                        thinkPanel.classList.remove('expanded');
                        const icon = thinkPanel.querySelector('.thinking-icon');
                        if (icon) icon.textContent = '▶';
                    }

                    row.classList.remove('step');
                    row.classList.add('assistant');
                    window._currentStepId = null;
                    break;
                }

                case 'streamStart': {
                    const row = document.createElement('div');
                    row.className = 'message-row assistant';
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.textContent = '🤖';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.id = 'streamingBubble';
                    row.appendChild(avatar);
                    row.appendChild(bubble);
                    messagesDiv.appendChild(row);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    currentStreamingBubble = bubble;
                    currentStreamingThinkPanel = null;
                    break;
                }

                case 'streamThinking': {
                    if (!currentStreamingThinkPanel) {
                        currentStreamingThinkPanel = createThinkingPanel();
                        const bubble = document.getElementById('streamingBubble');
                        if (bubble) {
                            bubble.parentElement.after(currentStreamingThinkPanel);
                        } else {
                            messagesDiv.appendChild(currentStreamingThinkPanel);
                        }
                    }
                    appendThinkingContent(currentStreamingThinkPanel, msg.text);
                    break;
                }

                case 'streamChunk': {
                    const bubble = document.getElementById('streamingBubble');
                    if (bubble) {
                        bubble.textContent += msg.text;
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }
                    if (currentStreamingThinkPanel) {
                        currentStreamingThinkPanel.classList.remove('expanded');
                        const icon = currentStreamingThinkPanel.querySelector('.thinking-icon');
                        if (icon) icon.textContent = '▶';
                    }
                    break;
                }

                case 'streamEnd': {
                    const bubble = document.getElementById('streamingBubble');
                    if (bubble) {
                        bubble.id = '';
                        if (msg.error) {
                            bubble.textContent += ' [流式传输中断]';
                        }
                    }
                    setLoading(false);
                    currentStreamingBubble = null;
                    currentStreamingThinkPanel = null;
                    break;
                }

                case 'error':
                    addMessageBubble('system', '❌ ' + msg.text);
                    setLoading(false);
                    break;

                case 'finalResult':
                    addMessageBubble('assistant', msg.text);
                    setLoading(false);
                    break;

                default:
                    break;
            }
        });

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;
            inputHistory.push(text);
            historyIndex = inputHistory.length;
            addMessageBubble('user', text);
            vscode.postMessage({ command: 'ask', text });
            userInput.value = '';
            userInput.style.height = 'auto';
            setLoading(true);
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.shiftKey && !sendBtn.disabled) {
                e.preventDefault();
                sendBtn.click();
                return;
            }
            if (e.key === 'ArrowUp' && !e.shiftKey && !e.ctrlKey) {
                const pos = userInput.selectionStart;
                const textBefore = userInput.value.substring(0, pos);
                const linesBefore = textBefore.split('\n');
                if (linesBefore.length === 1 && userInput.selectionStart === 0) {
                    e.preventDefault();
                    if (inputHistory.length === 0) return;
                    if (historyIndex === -1) historyIndex = inputHistory.length - 1;
                    else if (historyIndex > 0) historyIndex--;
                    userInput.value = inputHistory[historyIndex];
                    userInput.setSelectionRange(userInput.value.length, userInput.value.length);
                }
            } else if (e.key === 'ArrowDown' && !e.shiftKey && !e.ctrlKey) {
                const pos = userInput.selectionStart;
                const textAfter = userInput.value.substring(pos);
                const linesAfter = textAfter.split('\n');
                if (linesAfter.length === 1 && pos === userInput.value.length) {
                    e.preventDefault();
                    if (inputHistory.length === 0) return;
                    if (historyIndex < inputHistory.length - 1) {
                        historyIndex++;
                        userInput.value = inputHistory[historyIndex];
                    } else {
                        historyIndex = inputHistory.length;
                        userInput.value = '';
                    }
                    userInput.setSelectionRange(userInput.value.length, userInput.value.length);
                }
            }
        });

        function setLoading(loading) {
            sendBtn.disabled = loading;
            userInput.disabled = loading;
            sendBtn.textContent = loading ? 'AI 思考中...' : '发送';
        }

        // 拖动调整输入框高度
        (function resizeHeight() {
            const handle = document.getElementById('resize-handle');
            const textarea = document.getElementById('userInput');
            let startY, startHeight;

            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                startY = e.clientY;
                startHeight = parseInt(document.defaultView.getComputedStyle(textarea).height, 10);
                document.documentElement.style.cursor = 'ns-resize';

                const onMouseMove = (e) => {
                    const delta = startY - e.clientY;
                    let newHeight = startHeight + delta;
                    newHeight = Math.max(30, Math.min(200, newHeight));
                    textarea.style.height = newHeight + 'px';
                };

                const onMouseUp = () => {
                    document.documentElement.style.cursor = '';
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        })();
    </script>
</body>
</html>
